name: Build, test və ekran görüntüsü

# Windows-da Mac olmadan yoxlamaq üçün: hər push-da layihə qurulur, unit testlər
# simulyatorda işləyir, app işə salınır və ekran görüntüsü artefakt kimi yüklənir.
# İkinci job eyni kodu VLCKit ilə qurur ki, `#if canImport(MobileVLCKit)` içindəki
# kod da kompilyatordan keçsin.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: AVFoundation (build + test)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Alətlərin versiyası
        run: |
          xcodebuild -version
          swift --version

      - name: XcodeGen quraşdır
        run: brew install xcodegen

      - name: Layihəni yarat
        run: xcodegen generate

      - name: Simulyator yarat
        run: |
          RUNTIME=$(xcrun simctl list runtimes --json \
            | jq -r '.runtimes[] | select(.platform == "iOS" and .isAvailable) | .identifier' | tail -1)
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json \
            | jq -r '.devicetypes[] | select(.name | startswith("iPhone 16")) | .identifier' | head -1)
          echo "Runtime: $RUNTIME"
          echo "Device:  $DEVICE_TYPE"
          UDID=$(xcrun simctl create ci-device "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build və unit testlər
        run: |
          xcodebuild test \
            -project LiquidPlayer.xcodeproj \
            -scheme LiquidPlayer \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Appı işə sal və ekran görüntüsü çək
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP=$(find build/Build/Products -name "LiquidPlayer.app" -maxdepth 3 | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.example.liquidplayer

          # Appın ilk kadrı çəkilənə qədər gözləyirik.
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/01-library.png

      - name: Ekran görüntülərini yüklə
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/
          if-no-files-found: warn

  build-vlc:
    name: VLCKit ilə build
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen quraşdır
        run: brew install xcodegen

      - name: Layihəni yarat
        run: xcodegen generate

      - name: VLCKit (CocoaPods)
        run: pod install

      # CocoaPods-un «Embed Pods Frameworks» skripti Xcode-un skript sandbox-u ilə
      # işləmir, ona görə bu build-də sandbox söndürülür.
      - name: Build (iOS Simulator, VLCKit ilə)
        run: |
          xcodebuild build \
            -workspace LiquidPlayer.xcworkspace \
            -scheme LiquidPlayer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
