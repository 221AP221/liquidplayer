name: LiquidPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: az

settings:
  base:
    # App Store / TestFlight üçün yalnız bu sətri öz domeninlə dəyiş
    # (məs. `az.adin`), həm app, həm test bundle-ı ondan qurulur.
    BUNDLE_ID_PREFIX: com.example
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LiquidPlayer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Sources/Localization/Localizable.xcstrings
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Player
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking (Split View, Slide Over) bütün istiqamətləri tələb edir.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).liquidplayer
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    # Paylaşılan sxem: `xcodebuild test -scheme LiquidPlayer` testləri də işlədir.
    scheme:
      testTargets:
        - LiquidPlayerTests

  LiquidPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LiquidPlayerTests
    dependencies:
      - target: LiquidPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).liquidplayer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LiquidPlayer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LiquidPlayer
        BUNDLE_LOADER: $(TEST_HOST)
